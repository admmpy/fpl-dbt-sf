version: 2
sources:
  - name: fpl_raw
    database: fpl_db
    schema: fpl_raw
    tables:
    
      - name: fixtures
        description: Fixture data for FPL matches
        columns:
          - name: FIXTURE_ID
            description: Unique identifier for the fixture
            tests:
              - not_null
              - unique
          - name: GAMEWEEK_ID
            description: Gameweek identifier for the fixture
            tests:
              - not_null
          - name: KICKOFF_TIME
            description: Kickoff time for the fixture
          - name: TEAM_H
            description: Home team identifier
          - name: TEAM_A
            description: Away team identifier
          - name: TEAM_H_SCORE
            description: Home team score
          - name: TEAM_A_SCORE
            description: Away team score
          - name: FINISHED
            description: Whether the fixture has finished
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}

      - name: gameweeks
        description: Gameweek data including deadlines and scores
        columns:
          - name: GAMEWEEK_ID
            description: Unique identifier for the gameweek
            tests:
              - not_null
              - unique
          - name: IS_CURRENT
            description: Whether this is the current gameweek
          - name: DEADLINE_TIME
            description: Deadline time for the gameweek
          - name: FINISHED
            description: Whether the gameweek has finished
          - name: IS_NEXT
            description: Whether this is the next gameweek
          - name: IS_PREVIOUS
            description: Whether this is the previous gameweek
          - name: AVERAGE_ENTRY_SCORE
            description: Average score for entries in this gameweek
          - name: HIGHEST_SCORE
            description: Highest score in this gameweek
          - name: MOST_SELECTED
            description: Most selected player in this gameweek
          - name: MOST_TRANSFERRED_IN
            description: Most transferred in player in this gameweek
          - name: MOST_CAPTAINED
            description: Most captained player in this gameweek
          - name: MOST_VICE_CAPTAINED
            description: Most vice captained player in this gameweek
          - name: INGESTION_TIMESTAMP
            description: Timestamp when the data was ingested
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}

      - name: players
        description: Player statistics and details
        columns:
          - name: PLAYER_ID
            description: Unique identifier for the player
            tests:
              - not_null
              - unique
          - name: POSITION_ID
            description: Unique identifier for the player's position
            tests:
              - not_null
          - name: TEAM_ID
            description: Unique identifier for the player's team
            tests:
              - not_null
          - name: FIRST_NAME
            description: Player's first name
          - name: SECOND_NAME
            description: Player's second name
          - name: WEB_NAME
            description: Player's web name (display name on FPL website)
          - name: NOW_COST
            description: Current cost of the player
          - name: MINUTES
            description: Total minutes played 
          - name: GOALS_SCORED
            description: Total goals scored 
          - name: GOALS_CONCEDED
            description: Total goals conceded
          - name: ASSISTS
            description: Total assists
          - name: CLEAN_SHEETS
            description: Total clean sheets kept 
          - name: BONUS
            description: Total bonus points 
          - name: CHANCE_OF_PLAYING_NEXT_ROUND
            description: Odds for next gameweek
          - name: TOTAL_POINTS
            description: Total points for the player
          - name: FORM
            description: Recent form of the player 
          - name: SELECTED_BY_PERCENT
            description: Percentage of fantasy managers who have selected this player
          - name: STATUS
            description: Player's current status (a=available, u=unavailable, s=suspended, i=injured, d=doubtful, n=not playing)
          - name: GAMEWEEK_FETCHED
            description: Gameweek when the data was fetched
          - name: INGESTION_TIMESTAMP
            description: Timestamp when the data was ingested
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}

      - name: players_gameweek_snapshot
        description: |
          Append-only historical snapshots of player attributes per gameweek.
          Used for tracking point-in-time metrics like form, status, and cost.
          One row per player per gameweek per ingestion.
        columns:
          - name: SNAPSHOT_ID
            description: Auto-increment primary key for the snapshot
            tests:
              - not_null
              - unique
          - name: PLAYER_ID
            description: Player identifier
            tests:
              - not_null
          - name: GAMEWEEK_FETCHED
            description: Gameweek when the snapshot was captured
            tests:
              - not_null
          - name: WEB_NAME
            description: Player's web name (display name on FPL website)
          - name: FIRST_NAME
            description: Player's first name
          - name: SECOND_NAME
            description: Player's second name
          - name: TEAM_ID
            description: Player's team identifier
          - name: POSITION_ID
            description: Player's position identifier
          - name: NOW_COST
            description: Player cost at time of snapshot
          - name: SELECTED_BY_PERCENT
            description: Selection percentage at time of snapshot
          - name: FORM
            description: Form rating at time of snapshot
          - name: VALUE_SEASON
            description: Value season metric at time of snapshot
          - name: VALUE_FORM
            description: Value form metric at time of snapshot
          - name: TOTAL_POINTS
            description: Total points at time of snapshot
          - name: MINUTES
            description: Total minutes at time of snapshot
          - name: GOALS_SCORED
            description: Goals scored at time of snapshot
          - name: ASSISTS
            description: Assists at time of snapshot
          - name: CLEAN_SHEETS
            description: Clean sheets at time of snapshot
          - name: GOALS_CONCEDED
            description: Goals conceded at time of snapshot
          - name: BONUS
            description: Bonus points at time of snapshot
          - name: BPS
            description: Bonus point system score at time of snapshot
          - name: STATUS
            description: Player status at time of snapshot
          - name: CHANCE_OF_PLAYING_NEXT_ROUND
            description: Availability odds at time of snapshot
          - name: INGESTION_TIMESTAMP
            description: Timestamp when the snapshot was ingested
        config:
          freshness: null
  
      - name: teams
        description: Team information and fixtures
        columns:
          - name: TEAM_ID
            description: Unique identifier for the team
            tests:
              - not_null
              - unique
          - name: NAME
            description: Full name of the team
          - name: SHORT_NAME
            description: Short name of the team
          - name: POINTS
            description: Total points for the team
          - name: FORM
            description: Recent form of the team
          - name: POSITION
            description: Current position in the league table
          - name: STRENGTH
            description: Team strength rating
          - name: STRENGTH_ATTACK_AWAY
            description: Away attack strength
          - name: STRENGTH_DEFENCE_AWAY
            description: Away defence strength
          - name: STRENGTH_ATTACK_HOME
            description: Home attack strength
          - name: STRENGTH_DEFENCE_HOME
            description: Home defence strength
          - name: STRENGTH_OVERALL_AWAY
            description: Overall away strength
          - name: STRENGTH_OVERALL_HOME
            description: Overall home strength
          - name: INGESTION_TIMESTAMP
            description: Timestamp when the data was ingested
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}
      
      - name: raw_element_summary
        description: Player statistics and details
        columns:
          - name: id 
            description: Unique identifier for the player
          - name: ingestion_timestamp
            description: Timestamp when the data was ingested
          - name: data
            description: JSON data from the API
          - name: source_url
            description: URL of the API endpoint
          - name: endpoint_name
            description: Name of the API endpoint
        config:
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}

      - name: recommended_squad
        description: |
          Output from the ML/Optimisation pipeline. 
          Contains squad recommendations and predicted points.
        columns:
          - name: RECOMMENDATION_KEY
            description: Primary key (player_id + recommended_at)
            tests:
              - not_null
              - unique
          - name: RECOMMENDED_AT
            description: Timestamp when the recommendation was generated
          - name: PLAYER_ID
            description: Player identifier
          - name: POSITION_ID
            description: Position identifier
          - name: TEAM_ID
            description: Team identifier
          - name: NOW_COST
            description: Current cost of the player
          - name: GAMEWEEK_ID
            description: Gameweek for which the recommendation is valid
          - name: EXPECTED_POINTS_NEXT_GW
            description: Points predicted by the model for the next gameweek
          - name: EXPECTED_POINTS_5_GW
            description: Points predicted by the model for the next 5 gameweeks
          - name: IS_IN_SQUAD
            description: Boolean flag for recommended in squad
          - name: IS_STARTER
            description: Boolean flag for recommended starting XI
          - name: IS_CAPTAIN
            description: Boolean flag for recommended captain
          - name: IS_VICE_CAPTAIN
            description: Boolean flag for recommended vice-captain
        config:
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}

