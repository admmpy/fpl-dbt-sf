version: 2

models:
    - name: fct_ml_player_features_latest
      description: Latest player-level ML serving table for live inference
      config:
        meta:
          lightdash:
            hidden: true

      columns:
        - name: player_gameweek_key
          description: Latest player-gameweek surrogate key selected for inference
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('int_ml_player_features_gameweek')
                  field: player_gameweek_key

        - name: player_id
          description: Player identifier
          tests:
            - not_null
            - unique
            - relationships:
                arguments:
                  to: ref('dim_players')
                  field: player_id

        - name: gameweek_id
          description: Latest available gameweek identifier for the player
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('stg_gameweeks')
                  field: gameweek_id
            - dbt_utils.accepted_range:
                arguments:
                  min_value: 1
                  max_value: 38

        - name: web_name
          description: Player web name
          tests:
            - not_null

        - name: team_id
          description: Identifier for the player's team
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_teams')
                  field: team_id

        - name: opponent_team_id
          description: Identifier for the opponent team
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('dim_teams')
                  field: team_id

        - name: now_cost
          description: Player cost at the selected latest snapshot
          tests:
            - not_null

        - name: total_games_played
          description: Total games played at the latest selected snapshot
          tests:
            - not_null
            - dbt_utils.accepted_range:
                arguments:
                  min_value: 0
                  max_value: 38

        - name: team_position
          description: Current league position of the player's team
          tests:
            - not_null
            - dbt_utils.accepted_range:
                arguments:
                  min_value: 1
                  max_value: 20

        - name: opponent_team_position
          description: Current league position of the opponent team
          tests:
            - not_null
            - dbt_utils.accepted_range:
                arguments:
                  min_value: 1
                  max_value: 20
